<title>O nama — Source</title>

              <span style="font-family:'Maven Pro',Arial,sans-serif;font-size:18px;line-height:1.45;letter-spacing:0.02em;color:#c89858;text-wrap:pretty">{{ it.e }}</span>

        <div style="padding:20px;display:flex;flex-direction:column;gap:12px;flex:1">
          <span style="order:9;margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);font-family:'Maven Pro',Arial,sans-serif;font-weight:500;font-size:18px;letter-spacing:0.06em;color:#c89858">{{ t.d3 }}</span>
