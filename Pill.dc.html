<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:{{ radius }};border:1px solid {{ line }};background:{{ bg }};color:{{ fg }};font-family:'Maven Pro',system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:{{ tt }};white-space:nowrap;line-height:1"><sc-if value="{{ dot }}" hint-placeholder-val="{{ true }}"><span style="width:6px;height:6px;border-radius:50%;background:{{ fg }}"></span></sc-if>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;200px&quot;,&quot;height&quot;:&quot;60px&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dostupno&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;tag&quot;,&quot;claim&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'|'tag'|'claim'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? 'light';
    const t = {
      light: { fg: '#034c30', line: '#034c30', bg: 'transparent', radius: '999px', tt: 'none', dot: true },
      dark: { fg: '#c0e448', line: '#c0e448', bg: 'transparent', radius: '999px', tt: 'none', dot: true },
      tag: { fg: '#191b1c', line: '#e46024', bg: '#e46024', radius: '4px', tt: 'uppercase', dot: false },
      claim: { fg: '#c81818', line: '#c81818', bg: '#fff', radius: '4px', tt: 'uppercase', dot: false }
    }[tone] || {};
    return { ...t, label: this.props.label ?? 'dostupno' };
  }
}
</script>
</body>
</html>
