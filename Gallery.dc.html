<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;width:100%">
  <sc-if value="{{ label }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-family:'Maven Pro',Arial,sans-serif;font-weight:600;font-size:13px;letter-spacing:0.3em;text-transform:uppercase;color:{{ labelColor }}">{{ label }}</p></sc-if>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px;outline:1px solid {{ ol }};outline-offset:12px">
    <sc-for list="{{ tiles }}" as="k" hint-placeholder-count="0">
      <button onClick="{{ k.open }}" aria-label="{{ k.aria }}" style="position:relative;grid-column:{{ k.col }};aspect-ratio:{{ k.ratio }};padding:0;border:0;background:{{ bg }};cursor:zoom-in;overflow:hidden">
        <dc-import name="Img" src="{{ k.src }}" alt="{{ k.alt }}" fit="{{ fit }}" bg="{{ bg }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
        <sc-if value="{{ k.more }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;background:rgba(35,56,47,0.72);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Maven Pro',Arial,sans-serif;font-size:32px;letter-spacing:0.08em">{{ k.more }}</span></sc-if>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;480px&quot;,&quot;height&quot;:&quot;520px&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string,alt:string}[]&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;contain&quot;],&quot;default&quot;:&quot;cover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const S = window.SL, items = this.props.items || [], extra = items.length - 3;
    const fit = this.props.fit || 'cover';
    return {
      label: this.props.label || '', ol: this.props.tone === 'dark' ? 'rgba(192,228,72,0.45)' : 'rgba(35,56,47,0.45)', labelColor: this.props.tone === 'dark' ? '#8fbeaa' : '#23382f', fit, bg: fit === 'contain' ? '#fff' : '#ebefea',
      tiles: items.slice(0, 3).map((it, i) => ({ ...it, col: i === 0 ? '1 / -1' : 'auto', ratio: i === 0 ? '16/9' : '4/5', more: i === 2 && extra > 0 ? '+' + extra : '', aria: it.alt + (i === 2 && extra > 0 ? ' (+' + extra + ')' : ''),
        open: (e) => S && S.lightbox(it.src, it.alt, e.currentTarget, items, i) }))
    };
  }
}
</script>
</body>
</html>
