<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ spacer }}" hint-placeholder-val="{{ false }}"><div style="height:64px"></div></sc-if>
<header style="position:fixed;top:0;left:0;right:0;z-index:40;font-family:'Maven Pro',system-ui,sans-serif;background:{{ bg }};backdrop-filter:{{ blur }};-webkit-backdrop-filter:{{ blur }};box-shadow:{{ shadow }};transition:background 0.25s ease,box-shadow 0.25s ease">
  <div style="max-width:1200px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="{{ homeHref }}" aria-label="{{ t.homeAria }}" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff">
      <img src="img/k-c12-potpis-w.png" alt="Source" style="height:34px;width:auto;display:block">
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ false }}">
      <nav style="display:flex;align-items:center;gap:28px">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
          <div onMouseEnter="{{ n.enter }}" onMouseLeave="{{ n.leave }}" onFocus="{{ n.enter }}" onBlur="{{ n.blur }}" style="position:relative;display:flex;align-items:center;height:64px">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" aria-haspopup="{{ n.popup }}" aria-expanded="{{ n.expanded }}" style="display:flex;align-items:center;gap:6px;font-family:'Maven Pro',Arial,sans-serif;font-weight:500;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;color:#fff;border-bottom:2px solid {{ n.line }};padding:6px 0" style-hover="color:#c0e448">{{ n.label }}<sc-if value="{{ n.hasSub }}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true" style="transition:transform 0.3s ease;transform:{{ n.rot }}"><path d="M6 9l6 6 6-6"></path></svg></sc-if></a>
            <sc-if value="{{ n.hasSub }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:100%;left:50%;width:300px;padding-top:4px;transform:translateX(-50%) translateY({{ n.dy }});opacity:{{ n.op }};pointer-events:{{ n.pe }};visibility:{{ n.vis }};transition:opacity 0.25s ease, transform 0.3s ease, visibility 0.3s">
                <div style="background:rgba(28,45,38,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 18px 40px rgba(14,23,19,0.35);padding:8px;display:flex;flex-direction:column">
                  <sc-for list="{{ n.sub }}" as="s" hint-placeholder-count="0">
                    <a href="{{ s.href }}" aria-current="{{ s.cur }}" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;color:#fff;text-decoration:none;border-left:2px solid {{ s.line }};transition:background 0.2s ease" style-hover="background:rgba(255,255,255,0.06);color:#c0e448"><span style="font-size:15px;letter-spacing:0.04em">{{ s.label }}</span><span style="font-size:13px;color:#c89858;white-space:nowrap">{{ s.price }}</span></a>
                  </sc-for>
                  <a href="{{ n.href }}" style="margin-top:6px;padding:12px 14px;border-top:1px solid rgba(255,255,255,0.12);color:#8fbeaa;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;text-decoration:none" style-hover="color:#fff">{{ t.all }} →</a>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="https://ig.me/m/source_mainpage" style="display:inline-flex;align-items:center;height:44px;padding:0 20px;background:#fff;color:#23382f;border-radius:6px;font-family:'Maven Pro',Arial,sans-serif;font-weight:600;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none" style-hover="background:#ebefea;color:#23382f">{{ t.cta }}</a>
        <div role="group" aria-label="Jezik / Language" style="display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:0.1em;color:#8fbeaa">
          <sc-if value="{{ isSr }}" hint-placeholder-val="{{ true }}"><span style="color:#fff;font-weight:700">SR</span><span>·</span><a href="{{ enHref }}" hreflang="en" style="color:#8fbeaa;min-height:44px;display:inline-flex;align-items:center" style-hover="color:#fff">EN</a></sc-if>
          <sc-if value="{{ isEn }}" hint-placeholder-val="{{ false }}"><a href="{{ srHref }}" hreflang="sr" style="color:#8fbeaa;min-height:44px;display:inline-flex;align-items:center" style-hover="color:#fff">SR</a><span>·</span><span style="color:#fff;font-weight:700">EN</span></sc-if>
        </div>
      </nav>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ toggleMenu }}" aria-label="{{ t.menu }}" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;margin-right:-10px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer">
        <span style="display:block;width:22px;height:2px;background:#fff"></span>
        <span style="display:block;width:22px;height:2px;background:#fff"></span>
        <span style="display:block;width:14px;height:2px;background:#fff;margin-left:8px"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <nav style="background:#23382f;padding:8px 16px 24px;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,0.15)">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid rgba(255,255,255,0.15);font-family:'Maven Pro',Arial,sans-serif;font-weight:500;font-size:15px;letter-spacing:0.2em;text-transform:uppercase;text-decoration:none;color:#fff">{{ n.label }}<span style="color:#8fbeaa">→</span></a>
        <sc-if value="{{ n.hasSub }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;padding:4px 0 8px 16px;border-bottom:1px solid rgba(255,255,255,0.15)"><sc-for list="{{ n.sub }}" as="s" hint-placeholder-count="0"><a href="{{ s.href }}" style="display:flex;align-items:center;min-height:44px;font-size:15px;color:#ebefea;text-decoration:none">{{ s.label }}</a></sc-for></div></sc-if>
      </sc-for>
      <div role="group" aria-label="Jezik / Language" style="display:flex;align-items:center;gap:10px;min-height:56px;font-size:15px;letter-spacing:0.15em;color:#8fbeaa">
        <sc-if value="{{ isSr }}" hint-placeholder-val="{{ true }}"><span style="color:#fff;font-weight:700">SR</span><span>·</span><a href="{{ enHref }}" hreflang="en" style="color:#8fbeaa;min-height:44px;display:inline-flex;align-items:center">EN</a></sc-if>
        <sc-if value="{{ isEn }}" hint-placeholder-val="{{ false }}"><a href="{{ srHref }}" hreflang="sr" style="color:#8fbeaa;min-height:44px;display:inline-flex;align-items:center">SR</a><span>·</span><span style="color:#fff;font-weight:700">EN</span></sc-if>
      </div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pocetna&quot;,&quot;o-nama&quot;,&quot;proizvodi&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;pocetna&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;overlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, y: window.scrollY, menu: false, sub: '' };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onS = () => { const y = window.scrollY > 8; if (y !== this.state.y > 8) this.setState({ y: window.scrollY }); };
    window.addEventListener('resize', this.onR); window.addEventListener('scroll', this.onS, { passive: true });
    if (!window.SL) this.t = setInterval(() => { if (window.SL) { clearInterval(this.t); this.forceUpdate(); } }, 30);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('scroll', this.onS); clearInterval(this.t); clearTimeout(this.ct); }
  renderVals() {
    const S = window.SL; if (!S) return {};
    const wide = this.state.w >= 960, a = this.props.active ?? '';
    const overlay = this.props.overlay ?? true;
    const solid = !overlay || this.state.y > 8 || this.state.menu;
    const items = [['pocetna','Početna','Home','Pocetna.dc.html'],['source','Source','Source','Source.dc.html'],['proizvodi','Proizvodi','Products','Proizvodi.dc.html'],['blog','Blog','Blog','Blog.dc.html']];
    return {
      t: S.en ? { homeAria: 'Source — home', cta: 'Request a quote', menu: 'Menu', all: 'All products' } : { homeAria: 'Source — početna', cta: 'Zatražite ponudu', menu: 'Meni', all: 'Svi proizvodi' },
      homeHref: S.href('Pocetna.dc.html'), isEn: S.en, isSr: !S.en, enHref: S.switchHref(true), srHref: S.switchHref(false),
      wide, narrow: !wide, menuOpen: this.state.menu, showMobileMenu: !wide && this.state.menu, spacer: !overlay,
      bg: solid ? 'rgba(35,56,47,0.9)' : 'transparent', blur: solid ? 'blur(12px)' : 'none',
      shadow: solid && this.state.y > 8 ? '0 1px 0 rgba(255,255,255,0.08), 0 6px 20px rgba(22,36,30,0.25)' : 'none',
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      nav: items.map(([k,sr,en,file]) => { const has = k === 'proizvodi', open = has && this.state.sub === k, here = location.pathname.split('/').pop();
        return { label: S.en ? en : sr, href: S.href(file), current: k===a ? 'page' : undefined, line: k===a ? '#c0e448' : 'transparent',
          hasSub: has, popup: has ? 'true' : undefined, expanded: has ? String(open) : undefined, rot: open ? 'rotate(180deg)' : 'none',
          op: open ? 1 : 0, dy: open ? '0' : '-6px', pe: open ? 'auto' : 'none', vis: open ? 'visible' : 'hidden',
          enter: () => { clearTimeout(this.ct); if (has) this.setState({ sub: k }); },
          leave: () => { clearTimeout(this.ct); this.ct = setTimeout(() => this.setState({ sub: '' }), 160); },
          blur: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) this.setState({ sub: '' }); },
          sub: has ? Object.keys(S.PRODUCTS).map(pk => { const P = S.PRODUCTS[pk]; const cur = here === P.file; return { label: S.L(P.name), href: S.href(P.file), price: S.L(P.price), cur: cur ? 'page' : undefined, line: cur ? '#c0e448' : 'transparent' }; }) : [] }; })
    };
  }
}
</script>
</body>
</html>
