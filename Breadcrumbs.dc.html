<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="{{ aria }}" style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.4">
  <ol style="margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px">
    <sc-for list="{{ items }}" as="c" hint-placeholder-count="3">
      <li style="display:flex;align-items:center;gap:8px;min-height:32px">
        <sc-if value="{{ c.link }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}" style="color:{{ c.color }};text-decoration:underline;text-underline-offset:3px">{{ c.label }}</a><span aria-hidden="true" style="color:{{ c.color }}">/</span></sc-if>
        <sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span aria-current="page" style="color:{{ c.cur }}">{{ c.label }}</span></sc-if>
      </li>
    </sc-for>
  </ol>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;60px&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,href:string,last:boolean}[]&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.tone !== 'light', en = window.SL && window.SL.en;
    return {
      aria: en ? 'Breadcrumbs' : 'Putanja',
      items: (this.props.items || []).map(c => ({ ...c, link: !c.last, color: dark ? '#8fbeaa' : '#4d5a42', cur: dark ? '#fff' : '#191b1c' }))
    };
  }
}
</script>
</body>
</html>
